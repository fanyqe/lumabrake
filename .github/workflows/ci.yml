name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build LumaBrake.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LumaBrake.sln --configuration Release --no-build

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish portable package
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "artifacts"
          .\scripts\package-portable.ps1 -ArtifactRoot $artifactRoot -SelfContained $true

      - name: Generate SBOM
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Force $artifactRoot | Out-Null

          dotnet dotnet-CycloneDX LumaBrake.sln `
            --output $artifactRoot `
            --filename "LumaBrake.cdx.json" `
            --output-format Json `
            --exclude-test-projects `
            --set-name "LumaBrake" `
            --set-version "0.0.0"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaBrake-win-x64-portable
          path: |
            artifacts/LumaBrake-win-x64-portable.zip
            artifacts/LumaBrake-win-x64-portable.zip.sha256
            artifacts/LumaBrake.cdx.json
          if-no-files-found: error
