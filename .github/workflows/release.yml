name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  package-release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = $env:GITHUB_REF_NAME
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is required."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build LumaBrake.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LumaBrake.sln --configuration Release --no-build

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish portable package
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "artifacts"
          .\scripts\package-portable.ps1 -ArtifactRoot $artifactRoot -SelfContained $true

      - name: Generate SBOM
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Force $artifactRoot | Out-Null

          dotnet dotnet-CycloneDX LumaBrake.sln `
            --output $artifactRoot `
            --filename "LumaBrake.cdx.json" `
            --output-format Json `
            --exclude-test-projects `
            --set-name "LumaBrake" `
            --set-version "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $zip = "artifacts\LumaBrake-win-x64-portable.zip"
          $checksum = "artifacts\LumaBrake-win-x64-portable.zip.sha256"
          $sbom = "artifacts\LumaBrake.cdx.json"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            gh release create $tag $zip $checksum $sbom --target $env:GITHUB_SHA --title $tag --generate-notes
          } else {
            gh release create $tag $zip $checksum $sbom --verify-tag --title $tag --generate-notes
          }
